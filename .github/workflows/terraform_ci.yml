name: Terraform CI

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # azure/login@v2 below authenticates the CLI as a Service Principal
      # via OIDC; the azurerm provider refuses to use CLI-based auth for a
      # Service Principal session, so it must be told to use OIDC
      # directly instead (see terraform/provider.tf for the full
      # explanation). ARM_USE_OIDC lets terraform fetch its own federated
      # token via GitHub's ACTIONS_ID_TOKEN_REQUEST_TOKEN/URL, which the
      # `permissions: id-token: write` above already makes available.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:

      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: ./terraform

      - run: terraform init
        working-directory: ./terraform

      - run: terraform validate
        working-directory: ./terraform

      # soft_fail stays true, not as an unexamined blanket bypass: a local
      # `checkov -d terraform` run (2026-09-04) reports 21 passed / 24
      # failed. The large majority of the 24 are Premium/enterprise-tier or
      # paid add-on features -- Cosmos/Service-Bus/Storage customer-managed
      # keys, Service Bus double encryption + public-network-access-disabled
      # + local-auth-disabled (VNet isolation and local-auth are
      # Premium-tier-only, per ADR-001 in the paper), storage private
      # endpoint, App Service Plan zone redundancy / minimum instance count
      # -- that would require abandoning the cost-driven Standard-tier
      # decisions already recorded in ADR-001/ADR-005 and the near-$0 cost
      # model. ADR-001 already names its own revisit condition (real
      # production traffic, or sensitive data entering message payloads).
      # A smaller remainder (storage queue/blob logging, shared-key auth,
      # SAS expiration policy, blob anonymous access, soft-delete) are NOT
      # tier-locked and are real, unaddressed findings -- left for a
      # follow-up pass rather than silently skipped or guessed at here,
      # since several touch the storage account's auth surface for the Flex
      # Consumption deployment-package pull and should be verified against
      # a live deployment before being changed.
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: ./terraform
          soft_fail: true

      - run: terraform plan -out=tfplan.binary
        working-directory: ./terraform

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ./terraform/tfplan.binary
          retention-days: 3