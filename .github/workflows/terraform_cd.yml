name: Terraform CD
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to apply'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      # See terraform_ci.yml / terraform/provider.tf: azure/login@v2 below
      # leaves the CLI authenticated as a Service Principal, which the
      # azurerm provider refuses to use via CLI-based auth. ARM_USE_OIDC
      # switches it to fetch its own federated token instead.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init
        working-directory: ./terraform

      - uses: dawidd6/action-download-artifact@v2
        with:
          workflow: terraform_ci.yml
          name: tfplan-${{ github.event.inputs.commit_sha }}
          path: ./terraform

      - run: terraform apply -auto-approve tfplan.binary
        working-directory: ./terraform