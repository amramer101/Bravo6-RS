name: Python Tests

on:
  push:
    branches: [main]
    paths: ['src/worker/**']
  pull_request:
    paths: ['src/worker/**']
  workflow_dispatch:

jobs:
  scout-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every scout doubles as its own plugin module and its own regression
      # suite (`python3 test_NN_*.py --test`, unittest-based). Run each one
      # individually rather than via a shared test runner so a failure names
      # exactly which scout broke, matching how these suites are already run
      # locally and cited in the paper (e.g. "test_04_ssl_tls.py --test").
      #
      # TEMPORARY (development phase): continue-on-error is set below and
      # `set -e` was dropped from the loop so one scout's failure doesn't
      # stop the rest from running and reporting. This is a deliberate,
      # temporary relaxation while the author iterates solo -- revert to a
      # blocking suite once the project stabilizes and CI should start
      # gating merges again.
      - name: Run scout regression suites
        continue-on-error: true
        run: |
          for f in test_*.py; do
            echo "::group::${f} --test"
            python3 "${f}" --test
            echo "::endgroup::"
          done

      # TEMPORARY (development phase): see comment above -- non-blocking for
      # the same reason.
      - name: Run orchestrator regression suite
        continue-on-error: true
        run: python3 main_scanner.py --test
