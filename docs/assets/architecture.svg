<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">BRAVO6 request and report architecture</title><desc id="desc">Caller submits a URL to Gateway. Gateway sends a job to Service Bus. Worker consumes the job and writes Cosmos DB. Caller polls Report, which reads Cosmos DB. No queued document is created by Gateway.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#67dfd3" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="958" height="308" rx="20" fill="#101e2e" stroke="#304356"/><g fill="#172d3d" stroke="#3b6974" stroke-width="1.5"><rect x="30" y="85" width="135" height="70" rx="10"/><rect x="217" y="85" width="140" height="70" rx="10"/><rect x="410" y="85" width="140" height="70" rx="10"/><rect x="602" y="85" width="140" height="70" rx="10"/><rect x="795" y="85" width="135" height="70" rx="10"/><rect x="410" y="221" width="140" height="58" rx="10"/></g><g fill="#eff6fb" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600"><text x="98" y="116">Caller</text><text x="287" y="116">Gateway</text><text x="480" y="116">Service Bus</text><text x="672" y="116">Worker</text><text x="862" y="116">Cosmos DB</text><text x="480" y="248">Report</text></g><g fill="#b4cbd6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12"><text x="98" y="138">authorized scope</text><text x="287" y="138">intake + job ID</text><text x="480" y="138">queue</text><text x="672" y="138">10 scouts + score</text><text x="862" y="138">saved result</text><text x="480" y="266">JSON retrieval</text><text x="189" y="73">submit</text><text x="382" y="73">enqueue</text><text x="575" y="73">consume</text><text x="768" y="73">persist</text><text x="252" y="235">poll by scanId</text><text x="715" y="235">read result</text></g><g fill="none" stroke="#67dfd3" stroke-width="2" marker-end="url(#a)"><path d="M165 120H211"/><path d="M357 120H404"/><path d="M550 120H596"/><path d="M742 120H789"/><path d="M98 155V250H404"/><path d="M550 250H862V161"/></g><text x="30" y="37" fill="#67dfd3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">ASYNC EXECUTION · INDEPENDENT READ PATH</text><text x="30" y="193" fill="#b4cbd6" font-family="system-ui,sans-serif" font-size="12">202 acknowledges enqueueing. A stored result may not exist yet.</text></svg>