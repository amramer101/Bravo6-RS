site_name: BRAVO6
site_description: Serverless web-security research, implementation reference, and coverage-aware evaluation.
site_url: https://amramer101.github.io/Bravo6-RS/
repo_url: https://github.com/amramer101/Bravo6-RS
repo_name: Bravo6-RS
copyright: Copyright © 2026 Amr Medhat Amer · All Rights Reserved

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Overview:
      - Start here: index.md
      - Known limitations: limitations.md
  - System:
      - Architecture: architecture-overview.md
      - Request lifecycle: data-flow.md
      - Design decisions: architecture-decisions.md
      - Security boundaries: security-identity.md
  - Reference:
      - HTTP API: api-reference.md
      - Worker & ten scouts: software-architecture.md
      - Findings & scoring: scoring.md
      - Advisory data: advisory-data.md
      - Infrastructure: infrastructure.md
  - Research:
      - Experiment & results: research.md
      - Coverage & missingness: coverage.md
      - Validation & agreement: validation.md
      - Ethics & data handling: ethics.md
      - Evidence & references: references.md
  - Maintain:
      - Setup & deployment: deployment.md
      - Automation: cicd.md
      - Cost accounting: cost-finops.md
      - Maintainer guide: contributing.md
      - Rights & citation: rights.md
