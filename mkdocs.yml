site_name: Bravo6 Platform
site_description: Production-ready Azure Security Scanning Platform
site_url: https://your-username.github.io/bravo6-docs
repo_url: https://github.com/your-username/bravo6
repo_name: bravo6

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en

  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - tables

plugins:
  - search
  - mermaid2:
      version: "10.6.1"

nav:
  - Home: index.md
  - Infrastructure as Code: infrastructure.md
  - Architecture Overview: architecture-overview.md
  - Architecture Decisions: architecture-decisions.md
  - Software Architecture: software-architecture.md
  - Security & Identity: security-identity.md
  - Data Flow: data-flow.md
  - Cost & FinOps: cost-finops.md
  - CI/CD Pipeline: cicd.md
  - Deployment Guide: deployment.md